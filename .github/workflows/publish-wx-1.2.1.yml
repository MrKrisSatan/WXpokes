name: Publish Weather Variants 1.2.1

on:
  push:
    paths:
      - '.release-staging/READY-1.2.1'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild release ZIP
        shell: bash
        run: |
          cat .release-staging/weather_variants-1.2.1.zip.b64.part-* | base64 --decode > /tmp/weather_variants-1.2.1.zip
          echo "40da996dc208b3db83a5737faaeb43965ce81ab0e08c634a95ee888cf1d863e8  /tmp/weather_variants-1.2.1.zip" | sha256sum --check --strict
          unzip -t /tmp/weather_variants-1.2.1.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view 1.2.1 >/dev/null 2>&1; then
            gh release upload 1.2.1 /tmp/weather_variants-1.2.1.zip --clobber
            gh release edit 1.2.1 --title "Weather Variants 1.2.1" --notes-file - --latest <<'EOF'
          WX forms now inherit their base species' evolution method and requirements exactly, while evolving into the matching WX form when one exists. WX battle sprites and party/menu icons are also resolved live from the base species, so compatible visual overhauls carry through automatically.

          Also includes the 1.2.0 wild-spawn fix and holiday Primalweather gift system.
          EOF
          else
            gh release create 1.2.1 /tmp/weather_variants-1.2.1.zip --title "Weather Variants 1.2.1" --notes-file - --latest <<'EOF'
          WX forms now inherit their base species' evolution method and requirements exactly, while evolving into the matching WX form when one exists. WX battle sprites and party/menu icons are also resolved live from the base species, so compatible visual overhauls carry through automatically.

          Also includes the 1.2.0 wild-spawn fix and holiday Primalweather gift system.
          EOF
          fi
